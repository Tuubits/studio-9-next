<!DOCTYPE html>
<!--
  Netlify detects forms only in static HTML, not in Next.js pages. These hidden
  copies register the forms; the pages POST their submissions to this file.
  Keep the fields in sync with pages/cart.js and pages/golden-era-gaming/mystery.jsx.
-->
<html>
  <body>
    <form name="contact" data-netlify="true" data-netlify-honeypot="field-bot" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input name="field-bot" />
      <textarea name="message"></textarea>
      <input name="orderId" />
    </form>
    <form name="mystery-room-challenge" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="mystery-room-challenge" />
      <input name="bot-field" />
      <input name="answer" />
      <input name="email" type="email" />
    </form>
  </body>
</html>
