name: e2e

on:
  pull_request:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: true
          # Optional: without it the PayPal button test is skipped.
          Paypal_Client_2026: ${{ secrets.PAYPAL_CLIENT }}
          # Public value (it appears in every image URL); the build needs it.
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: rollfunkydice-com
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
